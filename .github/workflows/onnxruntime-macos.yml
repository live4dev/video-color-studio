name: Build CPU ONNX Runtime for macOS 13.0
on:
  push:
    branches: [codex/semantic-skin]
    paths:
      - tools/build_onnxruntime_macos.py
      - .github/workflows/onnxruntime-macos.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned developer build tools
        run: >-
          python -m pip install cmake==3.31.6 ninja==1.11.1.3 setuptools==75.8.0
          wheel==0.45.1 packaging==24.2 numpy==2.2.6
      - name: Compile official CPU runtime and audit every native binary
        run: python tools/build_onnxruntime_macos.py --jobs 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onnxruntime-macos13-source-build
          retention-days: 7
          path: |
            build/onnxruntime-macos/wheels/*.whl
            build/onnxruntime-macos/native-manifest.json
            build/onnxruntime-macos/notices/**
            build/onnxruntime-macos/build.log
            build/onnxruntime-macos/source.log
