name: Desktop photo-video tests and standalone packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Target to test and package
        type: choice
        default: all
        options:
          - all
          - windows
          - macos-arm64
          - macos-intel
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'windows' &&
            '[{"os":"windows-2022","target":"x86_64-pc-windows-msvc"}]' ||
            inputs.platform == 'macos-arm64' &&
            '[{"os":"macos-15","target":"aarch64-apple-darwin"}]' ||
            inputs.platform == 'macos-intel' &&
            '[{"os":"macos-15-intel","target":"x86_64-apple-darwin"}]' ||
            '[{"os":"windows-2022","target":"x86_64-pc-windows-msvc"},
              {"os":"macos-15","target":"aarch64-apple-darwin"},
              {"os":"macos-15-intel","target":"x86_64-apple-darwin"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python-platform ${{ matrix.target }} --extra dev --extra build
      - name: Build image-only OpenCV for macOS
        if: runner.os == 'macOS'
        run: uv run --no-sync python tools/build_image_opencv.py --jobs 2 --install
      - name: Install pinned CPU runtime build tools
        if: runner.os == 'macOS'
        run: >-
          uv pip install --python .venv/bin/python --no-deps
          cmake==3.31.6 ninja==1.11.1.3 wheel==0.45.1
      - name: Build CPU ONNX Runtime for macOS 13.0
        if: runner.os == 'macOS'
        run: uv run --no-sync python tools/build_onnxruntime_macos.py --jobs 2 --install
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q --junitxml=artifacts/tests.xml
      - run: uv run --no-sync python tools/generate_fixtures.py
      - name: Identify the Windows native cache environment
        id: windows-native-environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:ImageVersion) {
            "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          }
      - name: Restore Windows OpenCV build intermediates
        id: windows-native-cache
        if: runner.os == 'Windows' && steps.windows-native-environment.outputs.image != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/windows-opencv
            build/windows-inputs
            build/opencv-image-only/source
          key: windows-opencv-v1-${{ runner.arch }}-${{ steps.windows-native-environment.outputs.image }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'tools/build_windows_opencv.py', 'tools/windows_native_host.py', 'tools/build_windows_portable.py', 'tools/windows_pe.py') }}
      - run: uv run --no-sync python tools/build_desktop.py
      - name: Check that the Windows native build passed its audits
        id: windows-native-ready
        if: always() && runner.os == 'Windows' && steps.windows-native-environment.outputs.image != ''
        shell: pwsh
        run: |
          $nativeManifestPath = 'build/windows-opencv/manifest.json'
          if (Test-Path $nativeManifestPath) {
            $nativeManifest = Get-Content -Raw $nativeManifestPath | ConvertFrom-Json
            if ($nativeManifest.status -eq 'built') {
              'ready=true' >> $env:GITHUB_OUTPUT
            }
          }
      - name: Save audited Windows OpenCV build intermediates
        if: always() && steps.windows-native-ready.outputs.ready == 'true' && steps.windows-native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/windows-opencv
            build/windows-inputs
            build/opencv-image-only/source
          key: ${{ steps.windows-native-cache.outputs.cache-primary-key }}
      - name: Install and check the actual macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: uv run --no-sync python tools/install_smoke.py --archive "dist/Freedive-Color-Studio-macOS-$(uname -m).zip"
      - name: Install and check the actual Windows archive
        if: runner.os == 'Windows'
        run: uv run --no-sync python tools/install_smoke.py --archive dist/Freedive_Color_Studio_Windows_x64_UNTESTED.zip
      - name: Check packaged MCP and shared desktop project
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          uv run --no-sync python tools/smoke_control.py
          --output artifacts/ci-mcp-smoke
          --adapter "dist/Freedive Color Studio.app/Contents/MacOS/freedive-color-mcp"
          --application "dist/Freedive Color Studio.app/Contents/MacOS/Freedive Color Studio"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freedive-color-studio-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.json
            artifacts/tests.xml
            artifacts/latest-bundle-smoke.json
            artifacts/macos-targets.json
            artifacts/**/installation-test.json
            artifacts/**/windows-native.json
            artifacts/ci-mcp-smoke/result.json
            build/onnxruntime-macos/native-manifest.json
            build/onnxruntime-macos/build.log
            build/onnxruntime-macos/source.log
            !artifacts/**/private-control/**
